  secrets_to_external_inference: denied
  pinned_model_required: true
  provider_substitution_must_be_logged: true
  structured_output_required_for_workers: true
  r2_independent_provider_review_required: true
  r3_human_approval_required: true
  r3_automatic_execution_fallback: false
  live_activation_requires_approval: true
interim_operating_mode:
  mode: reconciliation_freeze
  status: proposed_not_live
  effective_until: canonical_lane_review_approved
  purpose:
  - prevent further provider and model routing drift
  - preserve observed runtime as evidence without promoting it to policy
  - block unreviewed provider activation and automatic fallback promotion
  - enable design validation before any fleet reconciliation
  permitted_existing_behavior:
    KIMI_CODE:
      status: observed_runtime_baseline
      scope: existing_non_privileged_work_only
      new_profile_assignments: denied
      new_model_alias_assignments: denied
      live_configuration_changes: denied
      runtime_adoption_as_policy: denied
  prohibited:
  - new_provider_activation
  - new_model_activation
  - new_model_alias_activation
  - openrouter_primary_routing
  - openrouter_automatic_fallback
  - automatic_execution_fallback
  - r2_or_r3_route_promotion
  - unapproved_profile_reconciliation
  - secret_or_restricted_data_external_egress
  - live_runtime_mutation
  required_before_route_activation:
  - canonical_provider_policy
  - canonical_model_catalog_entry
  - immutable_or_explicitly_pinned_model_identifier
  - approved_lane_definition
  - profile_eligibility_definition
  - data_classification_policy
  - structured_output_requirements_if_applicable
  - routing_eval_coverage
  - security_and_secret_egress_review
  - cost_and_latency_budget
  - explicit_human_approval
