profile_routing_classes:
  supervisor_control_plane:
    description: Planning, dispatch, synthesis, policy enforcement; no privileged execution.
    eligible_primary_lanes:
    - KIMI_CODE
    required_critic_for_r2_plus:
    - CLAUDE_CODE_PRO
    - CHATGPT_PRO
    - KIMI_CODE
    structured_output_required: true
  research_evidence:
    description: Source discovery, evidence packs, claim-to-source maps, cited briefs.
    eligible_primary_lanes:
    - KIMI_CODE
    required_critic_for_material_findings:
    - KIMI_CODE
    - NOUS_PORTAL
    - CHATGPT_PRO
    structured_output_required: true
    proposed_evidence_lanes:
    - PERPLEXITY_API
    required_gates:
    - provenance_artifact_required
    - source_conflict_detection
    - no_secret_egress
  implementation_coder:
    description: Bounded code changes and test construction under a scoped bridge.
    eligible_primary_lanes:
    - KIMI_CODE
    blocked_preferred_lanes:
    - CLAUDE_CODE_PRO
    required_gates:
    - independent_provider_review
    - qa_validation
    - rollback_plan_for_r2
  qa_validation:
    description: Deterministic test/schema/policy verification, model-assisted review only.
    eligible_primary_lanes:
    - KIMI_CODE
    required_gates:
    - executable_evidence
    - schema_validation
    - policy_gate
  security_adversarial_review:
    description: Attack-path and boundary review; no remediation authority.
    eligible_primary_lanes:
    - KIMI_CODE
    blocked_preferred_lanes:
    - CHATGPT_PRO
    required_gates:
    - independent_provider_family_if_r2_plus
  reflective_advisory:
    description: Curated snapshot reflection and drift signals only.
    eligible_primary_lanes:
    - KIMI_CODE
    required_gates:
    - curated_input_only
    - no_external_research_without_supervisor_request
  ops_infra_planning:
    description: Infrastructure planning and bounded non-production analysis.
    eligible_primary_lanes:
    - KIMI_CODE
    required_gates:
    - r3_manifest_for_privileged_or_destructive_actions
    - human_approval_for_production
  structured_worker:
    description: Typed extraction, transformation, drafting, documentation.
    eligible_primary_lanes:
    - KIMI_CODE
    required_gates:
    - schema_validation
    - confidence_threshold
    - quarantine_on_invalid_output
risk_tier_requirements:
  r0:
    review: optional
    fallback: allowed_if_same_or_lower_execution_mode
    human_approval: false
    external_dispatch: public_or_internal_only
  r1:
    review: critic_when_material_or_uncertain
    fallback: allowed_if_logged_and_policy_compatible
    human_approval: external_mutation_only
    workspace: sandboxed_or_read_only
  r2:
    review: mandatory_independent_provider_family
    fallback: draft_or_read_only_unless explicitly approved
    human_approval: policy_or_per_action_by_blast_radius
    rollback_required: true
  r3:
    review: mandatory_independent_review_and_policy_validation
    fallback: no_automatic_execution_fallback
    human_approval: mandatory_canonical_action_manifest
    rollback_required: true
fallback_policy:
  default: fail_closed_if_no_policy_compatible_fallback
  preserve_fields:
  - task_id
  - profile_id
  - data_classification
  - risk_tier
  - tool_scope
  - execution_mode
  - approval_requirements
  - output_schema
  - redaction_state
  on_unavailable_lane:
  - emit_provider_failure_event
  - attempt_only_enabled_profile_compatible_fallbacks
  - degrade_to_draft_only_or_blocked_degraded_when_needed
  prohibited:
  - silent_provider_substitution
  - risk_tier_downgrade
  - data_classification_downgrade
  - tool_scope_expansion
  - approval_requirement_removal
  - r3_execution_fallback
circuit_breakers:
  trip_on:
  - provider_outage_or_repeated_throttling
  - invalid_structured_output
  - policy_violation
  - privacy_or_data_boundary_violation
  - unexpected_metered_spend
  - latency_slo_breach
  - fallback_substitution_without_log
  - openrouter_primary_selection
  action: mark_route_unavailable_and_require_supervisor_review
  safe_degraded_modes:
  - draft_only
  - read_only
  - blocked_degraded
