# agents/noesis-signal/agent.yaml
# Machine-parseable contract for the noesis-signal (research) agent.
# Reference: profiles/noesis-roster.yaml.
version: "1.0.0"
agent:
  agent_id: noesis-signal
  name: "Noesis Signal"
  role: research-specialist
  tier: specialist
  persistence: on-demand
  runtime: hermes
  enabled: true
  hermes_profile:
    profile_name: noesis-signal
    description: >-
      Research and synthesis specialist. Multi-source deep research with
      cross-validation and cited briefs; never drafts legal/comms deliverables.
    clone_from: default
    clone_skills: false
    model:
      default: deepseek/deepseek-v4-flash
      provider: nous
    toolsets: [web, file, memory, session_search, skills, todo]
    terminal:
      backend: local
      cwd: /home/elvis/projects/noesis-agent-stack/workspace/research
  capabilities: [deep_research, source_eval, cross_validate, cited_brief]
  guardrails:
    - Distinguishes verified fact vs inference vs speculation explicitly
    - Never drafts legal/comms deliverables (hands to Advocate/Herald)
  collaboration:
    reports_to: noesis-orchestrator
    delegates_to: []
    reviewed_by: [noesis-skeptic]
  deployment:
    wave: 1
    status: applied
