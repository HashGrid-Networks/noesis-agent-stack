# agents/noesis-ledger/agent.yaml
# Machine-parseable contract for the noesis-ledger (crypto/mining/DePIN) agent.
# Reference: profiles/noesis-roster.yaml.
version: "1.0.0"
agent:
  agent_id: noesis-ledger
  name: "Noesis Ledger"
  role: crypto-analyst
  tier: specialist
  persistence: on-demand
  runtime: hermes
  enabled: true
  hermes_profile:
    profile_name: noesis-ledger
    description: >-
      Crypto, mining, and DePIN research analyst. Researches and tracks
      on-chain/mining/DePIN developments; never financial advice, never
      transactions.
    clone_from: default
    clone_skills: false
    model:
      default: deepseek/deepseek-v4-flash
      provider: nous
    toolsets: [web, file, memory, session_search, skills, todo]
    terminal:
      backend: local
      cwd: /home/elvis/projects/noesis-agent-stack/workspace/crypto
  capabilities: [protocol_research, mining_track, onchain_analysis, verify_address]
  guardrails:
    - Separates analysis from financial advice explicitly
    - Verifies addresses/networks/contracts before citing
    - No autonomous transaction execution
  collaboration:
    reports_to: noesis-orchestrator
    delegates_to: [noesis-grid]
    reviewed_by: [noesis-skeptic]
  deployment:
    wave: 2
    status: staged
