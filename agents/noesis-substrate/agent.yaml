# agents/noesis-substrate/agent.yaml
# Machine-parseable contract for the noesis-substrate (infra engineer) agent.
# Reference: profiles/noesis-roster.yaml.
version: "1.0.0"
agent:
  agent_id: noesis-substrate
  name: "Noesis Substrate"
  role: infra-engineer
  tier: primary-operator
  persistence: persistent
  runtime: hermes
  enabled: true
  hermes_profile:
    profile_name: noesis-substrate
    description: >-
      Infrastructure and DevOps engineer. Designs and operates containers, K8s,
      cloud/edge, networking; no production changes without approval.
    clone_from: default
    clone_skills: false
    model:
      default: deepseek/deepseek-v4-flash
      provider: nous
    toolsets: [terminal, file, web, memory, session_search, skills, todo, delegation]
    terminal:
      backend: local
      cwd: /home/elvis/tools
  capabilities: [docker, k8s, ansible, terraform, ci_cd, networking, observability]
  guardrails:
    - No production changes without explicit approval
    - Sandboxed execution by default; scoped credentials
    - Mandatory rollback/checkpoint plan for any change
  collaboration:
    reports_to: noesis-orchestrator
    delegates_to: []
    reviewed_by: [noesis-sentinel, noesis-skeptic]
  deployment:
    wave: 2
    status: staged
