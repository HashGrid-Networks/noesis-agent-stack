# profiles/noesis-roster.yaml
# Noesis Agent-Profile Roster — machine-readable manifest mapping the 16-agent
# Noesis fleet (reference: `~/Noesis Agent-Profile Architecture.md` §B–F) to
# Hermes profile creation parameters.
#
# Each entry becomes a Hermes profile under ~/.hermes/profiles/<name>/ and an
# agent definition under agents/noesis-<name>/ (SOUL.md + agent.yaml).
#
# Deployment policy (per reference §F):
#   - Wave 1 (Foundation + Implementation): applied to ~/.hermes.
#     Hermes-Core maps to the existing `default` profile (supervisor).
#   - Waves 2-3 (Integration + Optimization): staged in this repo, applied
#     on operator go-ahead with the same `hermes profile create` command.
#   - Reviewer-only profiles (sentinel, skeptic) get no execution authority.
#   - Applied profiles use the apply_model block (concrete, smoke-tested
#     lanes); model_routing stays as descriptive intent. The three nous
#     lanes (core/scribe/grid) were migrated to kimi 2026-09-16 (T12a).

version: "1.0.0"
source: "~/Noesis Agent-Profile Architecture.md"
updated: 2026-08-28

profiles:

  # ── Wave 1 — Foundation + Implementation (applied) ─────────────────────
  # CONSOLIDATED 2026-10-10: former noesis-core (Hermes-Core, applied, maps to
  # the Hermes `default` profile) merged into this single noesis-orchestrator
  # entry. Applied/live mapping takes precedence; staged wave-3 deltas preserved
  # in the comments below where they conflicted.
  noesis-orchestrator:
    name: "Noesis Hermes-Core"   # staged delta: "Noesis Orchestrator" (dropped on conflict)
    role: supervisor             # staged delta: control-plane-orchestrator (dropped on conflict)
    tier: supervisor
    persistence: persistent
    domain: "Supervisor/routing; approval-gate enforcement; memory index"
    maps_to: default            # the existing supervisor profile at ~/.hermes
    description: >-
      Noesis supervisor and router (Hermes-Core). Intake tasks, classify domain and risk tier, assign the narrowest-mandate specialist, enforce approval gates; never executes domain work. Consolidated definition also carries the staged control-plane orchestration scope (durable task contracts, dispatch, synthesis) — see agents/noesis-orchestrator/agent.yaml control_plane block.
    model_routing:
      default: kimi-k2.7-code @ kimi-coding   # T12a: nous key dead 2026-09-16
      escalation: openrouter (multi-model cross-check)
      fast: kimi-coding
      privacy: venice
    apply_model:
      model: kimi-k2.7-code
      provider: kimi-coding   # T12a: migrated off dead nous key 2026-09-16
      # T13 staged alternative (dropped on conflict, preserved for reference):
      #   model: claude-sonnet-5
      #   provider: anthropic   # subscription OAuth route (openrouter billing exhausted 2026-09-18)
    toolsets: [memory, session_search, file, web, clarify, todo, delegation, cronjob, skills]
    # Staged least-privilege delta (dropped on conflict, preserved for reference):
    #   toolsets: [memory, file, todo, clarify, delegation, session_search, skills]
    #   ("Deliberately excludes terminal and code_execution: least-privilege supervisor")
    terminal_cwd: .               # T12 sync: applied fleet uses "." for the
                                  # default profile (old ROSTER ground truth);
                                  # do not set to workspace/core.
    wave: 1
    status: applied

